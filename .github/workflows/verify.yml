name: Verify and publish research desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devs2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: Verify software and regenerate desktop
        run: python3 scripts/verify.py
      - name: Check generated artifacts
        run: git diff --exit-code -- index.html docs/theorems.json Devs/Audit.lean
      - name: Install pinned official Lean release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 0 https://github.com/leanprover/lean4/releases/download/v4.28.0/lean-4.28.0-linux.tar.zst --output "$RUNNER_TEMP/lean.tar.zst"
          cd "$RUNNER_TEMP"
          echo 'ceb3a3f844f7aebf63245e2b51c28d5b0ed38942c19f93cf3febd520302160bd  lean.tar.zst' | sha256sum --check
          tar --no-same-owner --zstd -xf lean.tar.zst
          echo "$RUNNER_TEMP/lean-4.28.0-linux/bin" >> "$GITHUB_PATH"
      - name: Build Lean library and executable
        run: lake build
      - name: Audit every theorem and computed example
        run: python3 scripts/check_lean.py
      - name: Run software fixture and create blank scoring packets
        run: python3 bench.py smoke --out "${{ runner.temp }}/devs2-software-smoke"
      - name: Save verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-and-formal-evidence
          path: |
            verification/local/
            ${{ runner.temp }}/devs2-software-smoke/SMOKE.json
          retention-days: 30
      - name: Package public desktop only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified desktop
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
